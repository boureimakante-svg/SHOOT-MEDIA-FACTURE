<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Diagnostic SHOOT FACTURE</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 16px; line-height: 1.5; }
  h1 { font-size: 22px; }
  p { margin: 8px 0; padding: 8px 10px; border-radius: 8px; word-break: break-word; }
  .ok { background: #E8F5EC; color: #1E8E3E; }
  .ko { background: #FDECEC; color: #C62828; font-weight: 700; }
  .info { background: #F1F1F1; color: #222; }
</style>
</head>
<body>
<h1>Diagnostic SHOOT FACTURE</h1>
<div id="r"></div>
<script type="module">
const r = document.getElementById("r");
const ligne = (type, texte) => {
  const p = document.createElement("p");
  p.className = type;
  p.textContent = texte;
  r.appendChild(p);
};

async function statut(nom) {
  try {
    const rep = await fetch(nom + "?v=" + Date.now(), { cache: "no-store" });
    return rep.status;
  } catch (e) {
    return "erreur réseau";
  }
}

async function tester(nom) {
  const s = await statut(nom);
  if (s !== 200) {
    ligne("ko", nom + " : fichier introuvable (réponse " + s + ")");
    return;
  }
  try {
    const m = await import("./" + nom + "?test=" + Date.now());
    ligne("ok", nom + " : chargé sans erreur. Contient : " + Object.keys(m).join(", "));
    if (m.ecrans) ligne("ok", nom + " : écrans : " + Object.keys(m.ecrans).join(", "));
  } catch (e) {
    ligne("ko", nom + " : ÉCHEC au chargement : " + e.message);
  }
}

try {
  const txt = await (await fetch("app.js?v=" + Date.now(), { cache: "no-store" })).text();
  const v = txt.match(/const VERSION = "([^"]+)"/);
  ligne("info", "app.js en ligne : version " + (v ? v[1] : "inconnue"));
} catch (e) {
  ligne("ko", "app.js illisible : " + e.message);
}

let liste = [];
try {
  const m = await import("./modules.js?test=" + Date.now());
  liste = m.MODULES || [];
  ligne("ok", "modules.js : liste des modules = " + liste.join(", "));
} catch (e) {
  ligne("ko", "modules.js : ÉCHEC : " + e.message);
}

for (const nom of liste) await tester(nom);

// Fichiers partagés : attention aux majuscules
ligne("info", "Outils.js (O majuscule) : réponse " + await statut("Outils.js"));
ligne("info", "outils.js (o minuscule) : réponse " + await statut("outils.js"));

// Quelle orthographe produits.js demande-t-il ?
try {
  const txt = await (await fetch("produits.js?v=" + Date.now(), { cache: "no-store" })).text();
  const m = txt.match(/from "\.\/([^"]+)"/);
  ligne("info", "produits.js demande le fichier : " + (m ? m[1] : "aucun"));
} catch (e) {
  ligne("info", "produits.js illisible");
}

ligne("info", "Fin du diagnostic.");
</script>
</body>
</html>
