<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SHOOT FACTURE</title>

  <meta name="description" content="Application de facturation SHOOT FACTURE, par SHOOT MEDIA">
  <meta name="theme-color" content="#0E0E0E">

  <!-- Pour que l'application s'installe proprement sur Android et iPhone -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SHOOT FACTURE">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <img src="icon.svg" alt="" class="brand-logo" width="32" height="32">
      <span class="brand-name">SHOOT FACTURE</span>
    </div>
    <span id="net-pill" class="pill pill-ok">En ligne</span>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Navigation principale">
    <button class="tab" data-tab="factures">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z M14 3v5h5 M10 13h6 M10 17h6"/></svg>
      <span>Factures</span>
    </button>
    <button class="tab" data-tab="clients">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      <span>Clients</span>
    </button>
    <button class="tab" data-tab="produits">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z M3 8l9 5 9-5 M12 13v8"/></svg>
      <span>Produits</span>
    </button>
    <button class="tab" data-tab="reglages">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3 M12 19v3 M2 12h3 M19 12h3 M4.9 4.9l2.1 2.1 M17 17l2.1 2.1 M4.9 19.1L7 17 M17 7l2.1-2.1"/></svg>
      <span>Réglages</span>
    </button>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
